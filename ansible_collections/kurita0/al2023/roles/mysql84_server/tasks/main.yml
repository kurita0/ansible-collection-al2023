---
- name: Install MySQL server
  dnf:
    name:
      - mysql-community-server
    state: present

- name: mysql-server.enabled
  systemd: name=mysqld enabled=yes

- name: mysql-server.started
  systemd: name=mysqld state=started

# Run mysql_secure_installation manually. 

- name: my.cnf
  template: src=my.cnf.j2 dest=/etc/my.cnf mode=0644 backup=yes
  notify: restart mysqld
