---
- name: amazon-cloudwatch-agent.installed
  dnf:
    pkg:
      - amazon-cloudwatch-agent
      - amazon-ssm-agent
      - collectd
    state: installed

- name: Start amazon-ssm-agent
  systemd:
    name: amazon-ssm-agent
    state: started
    enabled: yes

- name: copy config.json
  copy: src=amazon-cloudwatch-agent.json dest=/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json backup=yes
  notify: restart amazon-cloudwatch-agent

- name: Start amazon-cloudwatch-agent
  systemd:
    name: amazon-cloudwatch-agent
    state: started
    enabled: yes

- name: copy collectd.conf
  copy: src=collectd.conf dest=/etc/collectd.conf backup=yes
  notify: restart collectd

- name: Start collectd
  systemd:
    name: collectd
    state: started
    enabled: yes
